<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Carmo-Souza V8 Converter</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;margin:0;background:#0f172a;color:#e5e7eb}
    main{max-width:980px;margin:0 auto;padding:28px}
    textarea,input,button{font:inherit}
    textarea{width:100%;min-height:260px;border-radius:12px;border:1px solid #334155;background:#020617;color:#e5e7eb;padding:14px;box-sizing:border-box}
    input{width:80px;border-radius:8px;border:1px solid #334155;background:#020617;color:#e5e7eb;padding:8px}
    button,a.download{border:0;border-radius:10px;background:#38bdf8;color:#082f49;padding:10px 14px;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block;margin:6px 6px 6px 0}
    button.secondary{background:#334155;color:#e5e7eb}
    pre{white-space:pre-wrap;background:#020617;border:1px solid #334155;border-radius:12px;padding:14px;overflow:auto}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:14px 0}
    .card{background:#111827;border:1px solid #334155;border-radius:12px;padding:12px}
    .muted{color:#94a3b8}.error{color:#fecaca}.ok{color:#bbf7d0}
  </style>
</head>
<body>
<main>
  <h1>Carmo-Souza V8 Data Converter</h1>
  <p class="muted">Cole CSV ou JSON. A saida normaliza os dados para <code>time,x,s</code> e calcula metricas simples: norma L2, energia funcional aproximada, minimo, maximo, media e variacao total.</p>
  <div>
    <label>alpha <input id="alpha" type="number" step="any" value="1"></label>
    <label>beta <input id="beta" type="number" step="any" value="1"></label>
    <label>delta <input id="delta" type="number" step="any" value="1"></label>
  </div>
  <textarea id="input" placeholder="time,x,s&#10;0,0,0.1&#10;0,1,0.2&#10;1,0,0.15&#10;1,1,0.18"></textarea>
  <p>
    <button onclick="convert()">Converter</button>
    <button class="secondary" onclick="loadExample()">Exemplo</button>
    <button class="secondary" onclick="clearAll()">Limpar</button>
  </p>
  <div id="status" class="muted"></div>
  <div id="downloads"></div>
  <div id="cards" class="grid"></div>
  <h2>normalized.csv</h2><pre id="csvout"></pre>
  <h2>metrics.json</h2><pre id="jsonout"></pre>
</main>
<script>
const TIME_KEYS = new Set(['t','time','tempo','step','iteration','iteracao','iteração','frame']);
const X_KEYS = new Set(['x','pos','position','posicao','posição','space','i','index','indice','índice']);
const S_KEYS = new Set(['s','state','valor','value','u','psi','solution','solucao','solução','amplitude']);
function slug(x){return String(x).trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9_]+/g,'_').replace(/^_+|_+$/g,'')}
function num(x){if(x===null||x===undefined)return null;if(typeof x==='number'&&Number.isFinite(x))return x;let s=String(x).trim();if(!s)return null;if(s.includes(',')&&!s.includes('.'))s=s.replace(',','.');let n=Number(s.replace(';',''));return Number.isFinite(n)?n:null}
function findKey(row,set){for(const k of Object.keys(row)){if(set.has(slug(k)))return k}return null}
function splitCSVLine(line,delim){let out=[],cur='',q=false;for(let i=0;i<line.length;i++){let c=line[i];if(c==='"'){if(q&&line[i+1]==='"'){cur+='"';i++}else q=!q}else if(c===delim&&!q){out.push(cur);cur=''}else cur+=c}out.push(cur);return out.map(s=>s.trim())}
function sniff(text){let delims=[',',';','\t','|'];let first=text.split(/\r?\n/).find(x=>x.trim())||'';return delims.map(d=>[d,(first.match(new RegExp('\\'+d,'g'))||[]).length]).sort((a,b)=>b[1]-a[1])[0][0]||','}
function parseCSV(text){let lines=text.split(/\r?\n/).filter(x=>x.trim());if(!lines.length)return[];let d=sniff(text);let first=splitCSVLine(lines[0],d);let hasHeader=first.some(h=>TIME_KEYS.has(slug(h))||X_KEYS.has(slug(h))||S_KEYS.has(slug(h)));let rows=[];if(hasHeader){for(const line of lines.slice(1)){let cells=splitCSVLine(line,d),row={};first.forEach((h,i)=>row[h]=cells[i]??'');rows.push(row)}return rows}for(let i=0;i<lines.length;i++){let vals=splitCSVLine(lines[i],d).map(num).filter(x=>x!==null);if(vals.length===1)rows.push({x:i,s:vals[0]});else if(vals.length===2)rows.push({x:vals[0],s:vals[1]});else vals.forEach((v,j)=>rows.push({time:i,x:j,s:v}))}return rows}
function findRecords(obj){if(Array.isArray(obj))return obj;if(obj&&typeof obj==='object'){for(const k of ['data','rows','records','points','history','simulations','result','results'])if(Array.isArray(obj[k]))return obj[k];for(const v of Object.values(obj)){let r=findRecords(v);if(r.length)return r}}return[]}
function parseInput(text){let t=text.trim();if(!t)return[];if(t[0]==='{'||t[0]==='[')return findRecords(JSON.parse(t));return parseCSV(t)}
function normalizeRows(records){let out=[];records.forEach((item,idx)=>{if(item&&typeof item==='object'&&!Array.isArray(item)){let tk=findKey(item,TIME_KEYS),xk=findKey(item,X_KEYS),sk=findKey(item,S_KEYS);if(!sk){let nums=Object.entries(item).map(([k,v])=>[k,num(v)]).filter(x=>x[1]!==null);if(!nums.length)return;sk=nums[nums.length-1][0]}let s=num(item[sk]);if(s===null)return;let t=tk?num(item[tk]):null,x=xk?num(item[xk]):null;out.push({time:t??0,x:x??idx,s})}else{let s=num(item);if(s!==null)out.push({time:0,x:idx,s})}});return out.sort((a,b)=>a.time-b.time||a.x-b.x)}
function metrics(rows,alpha,beta,delta){let frames=new Map();rows.forEach(r=>{let k=String(r.time);if(!frames.has(k))frames.set(k,[]);frames.get(k).push(r)});let list=[];for(const [time,frame] of [...frames.entries()].sort((a,b)=>Number(a[0])-Number(b[0]))){frame.sort((a,b)=>a.x-b.x);let vals=frame.map(r=>r.s),xs=frame.map(r=>r.x),dxs=[];for(let i=0;i<xs.length-1;i++)dxs.push(Math.abs(xs[i+1]-xs[i]));let dx=dxs.length?dxs.reduce((a,b)=>a+b,0)/dxs.length:1;if(dx<=0)dx=1;let l2=Math.sqrt(vals.reduce((a,v)=>a+v*v,0)*dx),mean=vals.reduce((a,v)=>a+v,0)/vals.length,min=Math.min(...vals),max=Math.max(...vals),tv=0,ge=0;for(let i=0;i<vals.length-1;i++){tv+=Math.abs(vals[i+1]-vals[i]);let localDx=Math.abs(xs[i+1]-xs[i])||dx,g=(vals[i+1]-vals[i])/localDx;ge+=0.5*beta*g*g*localDx}let pot=vals.reduce((a,v)=>a+(0.5*alpha*v*v+delta*(0.25*v**4-0.5*v*v))*dx,0);list.push({time:Number(time),n:vals.length,l2_norm:l2,energy_functional:ge+pot,min,max,mean,total_variation:tv})}return{schema:'carmo-souza-v8-normalized',parameters:{alpha,beta,delta},epistemic_status:'E8 - Resultado computacional; requer validacao externa para alegacoes cientificas fortes.',frames:list,final:list[list.length-1]||{}}}
function csv(rows){return 'time,x,s\n'+rows.map(r=>`${r.time},${r.x},${r.s}`).join('\n')+'\n'}
function download(name,text,type){let blob=new Blob([text],{type});let url=URL.createObjectURL(blob);let a=document.createElement('a');a.href=url;a.download=name;a.className='download';a.textContent='Baixar '+name;return a}
function convert(){try{let rows=normalizeRows(parseInput(document.getElementById('input').value));if(!rows.length)throw new Error('Nenhum dado numerico reconhecido. Use colunas como x,s,time ou uma matriz numerica.');let a=num(alpha.value)??1,b=num(beta.value)??1,d=num(delta.value)??1;let m=metrics(rows,a,b,d),c=csv(rows),j=JSON.stringify(m,null,2);csvout.textContent=c;jsonout.textContent=j;status.className='ok';status.textContent=`OK: ${rows.length} pontos convertidos.`;downloads.innerHTML='';downloads.append(download('normalized.csv',c,'text/csv'),download('metrics.json',j,'application/json'),download('report.md',report(rows,m),'text/markdown'));cards.innerHTML='';for(const k of ['l2_norm','energy_functional','min','max','mean','total_variation']){if(k in m.final){let div=document.createElement('div');div.className='card';div.innerHTML=`<b>${k}</b><br>${m.final[k]}`;cards.appendChild(div)}}}catch(e){status.className='error';status.textContent='Erro: '+e.message}}
function report(rows,m){let lines=['# Carmo-Souza V8 - Relatorio de Conversao','',`Pontos normalizados: ${rows.length}`,`Frames temporais: ${m.frames.length}`,`Status epistemologico: ${m.epistemic_status}`,'','## Metricas finais',''];for(const k of ['l2_norm','energy_functional','min','max','mean','total_variation'])if(k in m.final)lines.push(`- ${k}: ${m.final[k]}`);return lines.join('\n')+'\n'}
function loadExample(){input.value='time,x,s\n0,0,0.1\n0,1,0.2\n0,2,0.3\n1,0,0.15\n1,1,0.18\n1,2,0.28\n'}
function clearAll(){input.value='';status.textContent='';downloads.innerHTML='';cards.innerHTML='';csvout.textContent='';jsonout.textContent=''}
loadExample();
</script>
</body>
</html>
